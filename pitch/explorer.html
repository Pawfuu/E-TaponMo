  <!-- Google Font: Inter -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    body {
      font-family: "Inter", sans-serif;
    }

    /* Sidebar Collapsible Behavior (Priority: Desktop/Computers) */
    @media (min-width: 768px) {
      #main-sidebar {
        width: 5rem;
        transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #main-sidebar:hover {
        width: 16rem;
      }

      #main-content-wrapper {
        padding-left: 5rem;
        transition: padding-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #main-sidebar:hover+#main-content-wrapper {
        padding-left: 16rem;
      }

      #main-sidebar:not(:hover) nav a {
        padding-left: 1.625rem;
      }

      #main-sidebar:not(:hover) nav a svg,
      #main-sidebar:not(:hover) nav a img {
        margin: 0;
      }

      #main-sidebar:not(:hover) .p-4 {
        padding-left: 0.5rem;
        padding-right: 0.5rem;
      }

      #main-sidebar:not(:hover) .profile-container {
        justify-content: center;
        padding-left: 0;
        padding-right: 0;
      }

      #main-sidebar:not(:hover) .logout-btn {
        padding-left: 1.625rem;
      }

      .sidebar-logo-container {
        width: 3rem;
        height: 3rem;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .sidebar-logo-img {
        width: 4rem;
        height: 4rem;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #main-sidebar:hover .sidebar-logo-container {
        width: 5rem;
        height: 5rem;
      }

      #main-sidebar:hover .sidebar-logo-img {
        width: 8rem;
        height: 8rem;
      }

      .branding-container {
        padding-left: 0.5rem;
        padding-right: 0.5rem;
        transition: padding 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #main-sidebar:hover .branding-container {
        padding-left: 1.25rem;
        padding-right: 1.25rem;
      }

      .sidebar-text {
        opacity: 0;
        max-width: 0;
        overflow: hidden;
        white-space: nowrap;
        transition: opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1), max-width 0.2s cubic-bezier(0.4, 0, 0.2, 1), margin 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: none;
      }

      #main-sidebar:hover .sidebar-text {
        opacity: 1;
        max-width: 12rem;
        pointer-events: auto;
        margin-left: 0.25rem;
      }

      #main-sidebar nav a {
        position: relative;
        overflow: hidden;
        border-left-width: 0 !important;
        transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
          background-color 0.25s ease,
          color 0.25s ease,
          padding 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #main-sidebar nav a:hover:not(.bg-emerald-50) {
        transform: translateX(4px);
        background-color: rgb(248 250 252 / 0.8);
      }

      #main-sidebar nav a.bg-emerald-50 {
        transform: translateX(4px);
        box-shadow: 0 4px 12px -2px rgba(16, 185, 129, 0.12), 0 2px 4px -1px rgba(16, 185, 129, 0.08);
        animation: tabActivate 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      @keyframes tabActivate {
        0% {
          transform: scale(0.95) translateX(0);
        }

        50% {
          transform: scale(1.02) translateX(6px);
        }

        100% {
          transform: scale(1) translateX(4px);
        }
      }

      #main-sidebar nav a::before {
        content: '';
        position: absolute;
        left: 0;
        top: 20%;
        height: 60%;
        width: 4px;
        border-radius: 0 4px 4px 0;
        background-color: rgb(16 185 129);
        transform: scaleY(0);
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        transform-origin: center;
      }

      #main-sidebar nav a.bg-emerald-50::before {
        transform: scaleY(1);
      }

      #main-sidebar nav a svg,
      #main-sidebar nav a img {
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.3s ease;
      }

      #main-sidebar nav a:hover svg,
      #main-sidebar nav a:hover img {
        transform: scale(1.1) rotate(2deg);
      }

      #main-sidebar nav a.bg-emerald-50 svg,
      #main-sidebar nav a.bg-emerald-50 img {
        transform: scale(1.15);
        color: rgb(4 120 87) !important;
      }
    }

    @media (max-width: 767px) {
      #main-sidebar {
        width: 4rem;
      }

      #main-content-wrapper {
        padding-left: 4rem;
      }

      .sidebar-text {
        display: none !important;
      }

      .branding-container {
        padding: 0.75rem 0.25rem;
        justify-content: center;
      }

      .sidebar-logo-container {
        width: 2.5rem;
        height: 2.5rem;
      }

      .sidebar-logo-img {
        width: 3.5rem;
        height: 3.5rem;
      }

      #main-sidebar nav a {
        padding-left: 1.125rem;
      }

      #main-sidebar .p-4 {
        padding: 0.75rem 0.25rem;
      }

      #main-sidebar .profile-container {
        justify-content: center;
        padding: 0;
      }

      #main-sidebar .logout-btn {
        padding-left: 0.875rem;
      }
    }

    .leaflet-top.leaflet-left {
      top: 140px !important;
      left: 10px !important;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-table-row {
      opacity: 0;
      animation: fadeSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
  <link class="leaflet-css" rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
